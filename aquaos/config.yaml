name: AquaOS
version: "0.2.6"
slug: aquaos
description: Safety policy, aquarium setup, diagnostics, and control in one Home Assistant panel
url: https://github.com/tylerkirby004-droid/AquaOS
arch:
  - amd64
image: ghcr.io/tylerkirby004-droid/aquaos-addon
startup: services
boot: auto
init: false
watchdog: http://[HOST]:8099/health/live
ingress: true
ingress_port: 8099
panel_icon: mdi:fishbowl-outline
panel_title: AquaOS
panel_admin: false
homeassistant_api: true
hassio_api: true
hassio_role: manager
map:
  - type: addon_config
    read_only: false
backup: cold
stage: experimental
options:
  site_name: home-reef
schema:
  site_name: match(^[a-z][a-z0-9-]{0,62}$)
