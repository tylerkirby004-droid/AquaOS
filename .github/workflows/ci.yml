name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aquaos-vision/pyproject.toml
      - name: Formatting
        run: test -z "$(gofmt -l ./cmd ./internal ./pkg)"
      - name: Installation assets
        run: |
          sh -n scripts/*.sh
          bash -n aquaos/run.sh
          bash -n aquaos-history/rootfs/etc/s6-overlay/s6-rc.d/influxdb/run
          bash -n aquaos-history/rootfs/etc/s6-overlay/s6-rc.d/init-aquaos-history/run
          sh -n aquaos/systemctl
          cp infrastructure/docker/.env.example infrastructure/docker/.env
          docker compose -f docker-compose.yml config --quiet
          docker compose -f infrastructure/docker/compose.yaml config --quiet
          docker compose -f infrastructure/docker/compose.yaml -f infrastructure/docker/compose.appliance.yaml config --quiet
          docker compose -f infrastructure/docker/compose.yaml -f infrastructure/docker/compose.nodered.yaml config --quiet
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1.3.1
        with:
          version: "2026.1"
          install-go: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency licenses
        run: go run github.com/google/go-licenses@v1.6.0 check ./... --allowed_licenses=Apache-2.0,BSD-2-Clause,BSD-3-Clause,EPL-2.0,ISC,MIT,MPL-2.0
      - name: Unit and race tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Optional vision contract tests
        run: |
          python -m pip install ./aquaos-vision[dev]
          python -m pytest aquaos-vision/tests
      - name: Linux builds
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/aquaos-linux-amd64 ./cmd/aquaos
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/aquaos-linux-arm64 ./cmd/aquaos
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath ./cmd/aquaosctl ./cmd/aquaos-admin ./cmd/aquaos-firstboot ./cmd/aquaos-ha-config
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath ./cmd/aquaosctl ./cmd/aquaos-admin
