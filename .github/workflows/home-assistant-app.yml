name: Home Assistant app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - aquaos/**
      - aquaos-history/**
      - cmd/**
      - internal/**
      - pkg/**
      - go.mod
      - go.sum
      - .github/workflows/home-assistant-app.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: aquaos/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_VERSION=0.2.5
            BUILD_ARCH=amd64
          tags: |
            ghcr.io/tylerkirby004-droid/aquaos-addon:0.2.5
            ghcr.io/tylerkirby004-droid/aquaos-addon:edge
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: aquaos-history/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_VERSION=0.1.1-history
            BUILD_ARCH=amd64
          tags: ghcr.io/tylerkirby004-droid/aquaos-history-addon:0.1.1-history
