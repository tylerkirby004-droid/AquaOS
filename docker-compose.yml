# Development/integration convenience only. Production AquaOS Core runs natively
# under systemd in its dedicated Linux amd64 Control VM and does not depend on
# Docker or Mosquitto for critical local control.
services:
  aquaos:
    build: .
    restart: unless-stopped
    environment:
      AQUAOS_HTTP_ADDRESS: ":8080"
      AQUAOS_MQTT_BROKER: tcp://mosquitto:1883
      AQUAOS_MQTT_ENABLED: "false"
      AQUAOS_MQTT_USERNAME: ${MQTT_AQUAOS_USERNAME:-}
      AQUAOS_MQTT_PASSWORD: ${MQTT_AQUAOS_PASSWORD:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "-url", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infrastructure/docker/mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data

volumes:
  mosquitto-data:
