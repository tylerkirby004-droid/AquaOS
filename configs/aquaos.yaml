schema_version: 1

application:
  log_level: info
  startup_timeout: 30s
  shutdown_timeout: 15s
  component_timeout: 5s
  event_concurrency: 64

http:
  address: "localhost:8080"
  read_timeout: 5s
  write_timeout: 10s
  idle_timeout: 60s
  bearer_token_file: ""
  maximum_request_bytes: 65536
  mutation_rate: 10
  mutation_burst: 20

mqtt:
  # MQTT is optional external integration and is not in the critical control path.
  enabled: false
  site_id: home-reef
  broker: tcp://localhost:1883
  client_id: aquaos
  connect_timeout: 10s
  keep_alive: 30s
  disconnect_quiesce: 250ms
  required_for_ready: true
  maximum_payload: 262144
  queue_capacity: 256
  idempotency_capacity: 4096
  reconnect_minimum: 1s
  reconnect_maximum: 1m
  reconnect_jitter: 0.2
  home_assistant:
    enabled: false
    command_ttl: 10s
    tombstones: []

simulator:
  # Foundation-only lifecycle adapter; it cannot reach or command real hardware.
  enabled: true

# Real LAN adapters remain disabled until the Prompt 8 bench configuration is
# reviewed on the dedicated Control VM. Addresses and IDs are always external.
adapters:
  shelly:
    enabled: false
    endpoints: []
  esp32:
    enabled: false
    endpoints: []

bench:
  enabled: false
  safe_load_acknowledged: false

inventory:
  devices: []
  sensors: []
  equipment: []

# Credentials are intentionally omitted. Supply AQUAOS_MQTT_USERNAME and
# AQUAOS_MQTT_PASSWORD through the process environment or a secrets manager.
