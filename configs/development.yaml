schema_version: 1

application:
  log_level: info
  startup_timeout: 15s
  shutdown_timeout: 5s
  component_timeout: 2s
  event_concurrency: 64

http:
  # Port zero prevents collisions and keeps the bootstrap listener local-only.
  address: "localhost:0"
  read_timeout: 2s
  write_timeout: 2s
  idle_timeout: 10s
  bearer_token_file: ""
  maximum_request_bytes: 65536
  mutation_rate: 10
  mutation_burst: 20

mqtt:
  # The foundation verification must succeed without a broker.
  enabled: false
  site_id: development
  broker: ""
  client_id: ""
  connect_timeout: 2s
  keep_alive: 30s
  disconnect_quiesce: 250ms
  required_for_ready: false
  maximum_payload: 262144
  queue_capacity: 64
  idempotency_capacity: 1024
  reconnect_minimum: 1s
  reconnect_maximum: 30s
  reconnect_jitter: 0.2

simulator:
  enabled: true

adapters:
  shelly:
    enabled: false
    endpoints: []
  esp32:
    enabled: false
    endpoints: []

bench:
  enabled: false
  safe_load_acknowledged: false

inventory:
  devices: []
  sensors: []
  equipment: []
